<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="sytle.css">
</head>

<body>
    <header>
        <h1>Gerenciamento de Produtos</h1>
        <p>Cadastro e controle de produtos</p>
    </header>
    <main>
        <section class="formulario">
            <h2>Cadastrar produto</h2>
            <form id="form-produto"> <input type="text" id="descricao" placeholder="Descrição do produto" required>
                <input type="number" id="preco" placeholder="Preço" step="0.01" min="0" required> <input type="text"
                    id="categoria" placeholder="Categoria" required> <input type="number" id="estoque"
                    placeholder="Estoque" min="0" required> <button type="submit"> Cadastrar produto </button> </form>
        </section>
        <section class="produtos">
            <h2>Produtos cadastrados</h2>
            <div id="lista-produtos"></div>
        </section>
    </main>
    <script src="app.js"></script>
</body>

</html>
